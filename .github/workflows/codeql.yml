name: "CodeQL Advanced"

on:
  push:
    branches: [ "after-submit-feats" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '43 6 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Run manual build steps
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
            echo 'Building the Swift project...'
            # Ensure we are in the root directory of the project where the .xcodeproj file is located
            cd $GITHUB_WORKSPACE
            # Run the build command with the correct scheme
            xcodebuild -scheme Pokedex -sdk iphonesimulator -configuration Debug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
